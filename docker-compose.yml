services:
  db:
    image: postgres:16-alpine
    container_name: platformi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: platformi
      POSTGRES_PASSWORD: platformi
      POSTGRES_DB: platformi
    ports:
      - "5433:5432"
    volumes:
      - platformi-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platformi -d platformi"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  platformi-pgdata:
